<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Plus menu with Add asset</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&amp;family=Figtree:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#F1EEFF}
a{color:#1B1530}a:hover{color:#4E4766}
button{font:inherit;color:inherit;cursor:pointer}
</style>
</helmet>
<div style="width: 520px; height: 560px; box-sizing: border-box; padding: 24px; display: flex; flex-direction: column; justify-content: flex-end; gap: 14px; background: #F1EEFF; color: #1B1530; font-family: 'Figtree', system-ui, sans-serif; font-size: 15px">
  <div role="menu" aria-label="Add or make" style="display: flex; flex-direction: column; gap: 10px; padding: 14px; border: 2px solid #1B1530; border-radius: 20px; background: #FFFFFF; box-shadow: 6px 6px 0 #1B1530">
    <div style="display: flex; align-items: center; justify-content: space-between">
      <span style="font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 16px">What shall we add?</span>
      <a href="#" style="font-size: 13px; font-weight: 700">Manage</a>
    </div>

    <a href="EditorPicker.dc.html" role="menuitem" style="display: flex; align-items: center; gap: 12px; padding: 12px; border: 2px solid #1B1530; border-radius: 14px; background: #D6F0EE; box-shadow: 3px 3px 0 #1B1530; text-decoration: none">
      <span style="flex: none; width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; border: 2px solid #1B1530; border-radius: 12px; background: #FFFFFF">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#1B1530" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="2"></rect><circle cx="9" cy="9" r="2"></circle><path d="M21 15l-5-5L5 21"></path></svg>
      </span>
      <span style="flex: 1; display: flex; flex-direction: column">
        <span style="font-weight: 800">Add asset</span>
        <span style="font-size: 13px; color: #3A3352">A logo, icon or picture from your library</span>
      </span>
      <span style="padding: 2px 8px; border-radius: 999px; background: #1B1530; color: #FFFFFF; font-size: 11px; font-weight: 800">New</span>
    </a>

    <div style="font-size: 12px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; color: #4E4766; margin-top: 4px">Make with Claude</div>
    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
      <a href="#" role="menuitem" style="display: flex; align-items: center; gap: 8px; padding: 10px 12px; border: 2px solid #1B1530; border-radius: 14px; background: #FFD6C9; font-weight: 700; text-decoration: none">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#1B1530" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 6h10M10 12h10M10 18h10"></path><path d="M3.5 6l1.5 1.5L7.5 5M3.5 12l1.5 1.5 2.5-2.5M3.5 18l1.5 1.5 2.5-2.5"></path></svg>Quiz</a>
      <a href="#" role="menuitem" style="display: flex; align-items: center; gap: 8px; padding: 10px 12px; border: 2px solid #1B1530; border-radius: 14px; background: #D7E8FF; font-weight: 700; text-decoration: none">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#1B1530" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="8" r="3"></circle><path d="M3 20c0-3.3 2.7-6 6-6s6 2.7 6 6"></path><path d="M16 4.5a3 3 0 0 1 0 6"></path><path d="M18 14c2 .8 3 3 3 6"></path></svg>Differentiate</a>
      <a href="#" role="menuitem" style="display: flex; align-items: center; gap: 8px; padding: 10px 12px; border: 2px solid #1B1530; border-radius: 14px; background: #DFF5D8; font-weight: 700; text-decoration: none">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#1B1530" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M6 3h9l4 4v14H6z"></path><path d="M14 3v5h5M9 13h6M9 17h6"></path></svg>Worksheet</a>
      <a href="#" role="menuitem" style="display: flex; align-items: center; gap: 8px; padding: 10px 12px; border: 2px solid #1B1530; border-radius: 14px; background: #FFF0B8; font-weight: 700; text-decoration: none">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#1B1530" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="4" width="16" height="16" rx="2"></rect><path d="M8 9h8M8 13h8M8 17h5"></path></svg>Speaker notes</a>
      <a href="#" role="menuitem" style="display: flex; align-items: center; gap: 8px; padding: 10px 12px; border: 2px solid #1B1530; border-radius: 14px; background: #EAD9FF; font-weight: 700; text-decoration: none">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#1B1530" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="13" r="8"></circle><path d="M12 9v4l2.5 2.5M9 2h6"></path></svg>Starter &amp; plenary</a>
      <a href="#" role="menuitem" style="display: flex; align-items: center; gap: 8px; padding: 10px 12px; border: 2px dashed #1B1530; border-radius: 14px; background: #FFFFFF; font-weight: 700; text-decoration: none">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#1B1530" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>More plugins</a>
    </div>
  </div>

  <div style="display: flex; align-items: center; gap: 8px; padding-left: 4px">
    <button type="button" aria-label="Add or make" aria-expanded="true" aria-haspopup="menu" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; border: 2px solid #1B1530; border-radius: 50%; background: #FF6B3D">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>
    </button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":520,"height":560}}'>

  renderVals() {
    return {};
  }

</body>
</html>
